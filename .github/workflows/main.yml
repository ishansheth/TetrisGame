name: Build TetrisGame (Bazel)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Xvfb
      run: sudo apt-get install -y xvfb

    - name: Start Xvfb
      run: Xvfb :99 &

    - name: Set DISPLAY variable
      run: echo "DISPLAY=:99" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsfml-dev
        sudo apt-get install -y curl
        curl -LO "https://github.com/bazelbuild/bazel/releases/download/7.0.0/bazel-7.0.0-linux-x86_64"
        chmod +x bazel-7.0.0-linux-x86_64
        sudo mv bazel-7.0.0-linux-x86_64 /usr/local/bin/bazel

    - name: Build with Bazel
      run: bazel build //...

    - name: List build output
      run: ls -l bazel-bin

    - name: Run TetrisGame (headless, with screenshot)
      env:
        DISPLAY: :99
        TETRISGAME_RESOURCES: $(pwd)/bazel-bin/TetrisGame/resources
      run: ./bazel-bin/tetris --take-screenshot      

    - name: Upload Screenshot
      uses: actions/upload-artifact@v4
      with:
        name: tetrisgame-screenshot
        path: screenshot.png
      
    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tetrisgame-binaries
        path: bazel-bin/      
